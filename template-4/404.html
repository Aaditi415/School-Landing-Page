<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) | EDUVERSE School</title>

    <meta
      name="description"
      content="The page you are looking for could not be found. Return to the EDUVERSE School homepage and continue exploring."
    />

    <meta name="author" content="EDUVERSE School" />
    <meta name="robots" content="noindex, follow" />

    <meta name="theme-color" content="#263B70" />

    
    <!-- Favicon -->
    <link rel="icon" type="image/svg" href="assets/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/error-404.css" />
    <link rel="stylesheet" href="css/responsive-page.css" />
  </head>
  <body>
    <main class="error-page">
      <div class="error-decoration error-decoration-one"></div>
      <div class="error-decoration error-decoration-two"></div>

      <div class="error-container">
        <a href="index.html" class="error-logo">
          <span class="error-logo-icon">
            <i data-lucide="graduation-cap"></i>
          </span>
          EDUVERSE
        </a>

        <div class="error-illustration">
          <div class="error-404-number">
            <span>4</span>

            <div class="error-planet">
              <i data-lucide="globe"></i>
            </div>

            <span>4</span>
          </div>

          <div class="error-floating-icon error-book">
            <i data-lucide="book-open"></i>
          </div>

          <div class="error-floating-icon error-compass">
            <i data-lucide="compass"></i>
          </div>

          <div class="error-ground"></div>
        </div>

        <span class="error-eyebrow">OOPS! WRONG CLASSROOM</span>

        <h1>Looks Like You've<br /><span>Lost Your Way.</span></h1>

        <p class="error-description">
          The page you're looking for may have moved, been removed, or never
          existed. Don't worry, let's get you back on track.
        </p>

        <div class="error-actions">
          <a href="index.html" class="error-primary-btn">
            <i data-lucide="house"></i>
            Back to Homepage
          </a>

          <a href="index.html#contact" class="error-secondary-btn">
            Contact Support
          </a>
        </div>

        <div class="error-footer">
          <span>Keep exploring. Keep learning.</span>
          <span>© 2026 EDUVERSE School</span>
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
