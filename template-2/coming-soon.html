<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon | EDUVERSE School</title>

    <meta
      name="description"
      content="Something exciting is coming soon to EDUVERSE School. Stay connected to discover our latest updates and upcoming experiences."
    />

    <meta name="author" content="EDUVERSE School" />
    <meta name="robots" content="noindex, follow" />

    <meta name="theme-color" content="#263B70" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg" href="assets/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/coming-soon.css" />
    <link rel="stylesheet" href="css/responsive-page.css" />
  </head>
  <body>
    <main class="coming-soon-page">
      <div class="coming-soon-decoration coming-decoration-one"></div>
      <div class="coming-soon-decoration coming-decoration-two"></div>
      <div class="coming-soon-decoration coming-decoration-three"></div>

      <div class="coming-soon-container">
        <a href="index.html" class="coming-soon-logo">
          <span class="coming-logo-icon">
            <i data-lucide="graduation-cap"></i>
          </span>
          EDUVERSE
        </a>

        <div class="coming-soon-illustration">
          <div class="coming-orbit orbit-one"></div>
          <div class="coming-orbit orbit-two"></div>

          <div class="coming-icon-card coming-card-left">
            <i data-lucide="book-open"></i>
          </div>

          <div class="coming-main-icon">
            <i data-lucide="rocket"></i>
          </div>

          <div class="coming-icon-card coming-card-right">
            <i data-lucide="sparkles"></i>
          </div>

          <span class="coming-dot coming-dot-one"></span>
          <span class="coming-dot coming-dot-two"></span>
        </div>

        <span class="coming-soon-badge">
          <span></span>
          SOMETHING EXCITING IS ON ITS WAY
        </span>

        <h1>
          A Little More Time.<br />
          <span>Something Wonderful.</span>
        </h1>

        <p class="coming-soon-description">
          We're working on something special for our school community. Stay
          connected and be among the first to explore what's next.
        </p>

        <div class="coming-soon-actions">
          <a href="index.html" class="coming-primary-btn">
            Back to Home
            <i data-lucide="arrow-right"></i>
          </a>

          <a href="index.html#contact" class="coming-secondary-btn">
            Contact Us
          </a>
        </div>

        <div class="coming-soon-footer">
          <span>Made with care for curious minds.</span>
          <span>© 2026 EDUVERSE School</span>
        </div>
      </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
